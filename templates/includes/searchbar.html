<!-- searchbar.html -->
<form method="GET" action="{{ action_url|default:'.' }}" class="search-bar" style="display:flex; align-items:center; background:var(--bg-glass); border:1px solid var(--border-glass); border-radius:var(--radius-sm); overflow:hidden;">
  <input type="text" name="q" value="{{ request.GET.q }}" placeholder="{{ search_placeholder|default:'Search...' }}" style="flex:1; background:none; border:none; padding:10px 14px; color:var(--text-primary); outline:none; font-size:14px;" />
  <button type="submit" style="background:none; border:none; padding:10px 14px; color:var(--text-muted); cursor:pointer;">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
  </button>
</form>
