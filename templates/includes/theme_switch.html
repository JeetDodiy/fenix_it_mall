<!-- theme_switch.html -->
<label class="theme-switch-wrapper" style="display:flex; align-items:center; cursor:pointer;">
  <input type="checkbox" id="theme-switch" style="display:none;" />
  <div class="theme-switch-icon" style="width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:8px; background:var(--bg-glass); border:1px solid var(--border-glass); color:var(--text-muted); transition:all var(--transition);">
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" id="icon-sun" style="display:none;"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" id="icon-moon"><path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
  </div>
</label>
<style>
  [data-theme="dark"] #icon-sun { display: block !important; }
  [data-theme="dark"] #icon-moon { display: none !important; }
  [data-theme="light"] #icon-sun { display: none !important; }
  [data-theme="light"] #icon-moon { display: block !important; }
</style>
