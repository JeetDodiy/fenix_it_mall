<!-- modal.html -->
<div class="modal-backdrop" id="{{ modal_id }}" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); z-index:1000; align-items:center; justify-content:center; padding:24px;">
  <div class="glass-card" style="max-width:{{ modal_width|default:'500px' }}; width:100%; max-height:90vh; overflow-y:auto; animation:modalIn 0.3s ease;">
    <div style="padding:20px; border-bottom:1px solid var(--border-glass); display:flex; align-items:center; justify-content:space-between;">
      <h3 style="margin:0; font-size:18px; font-weight:600;">{{ modal_title }}</h3>
      <button data-modal-close style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:24px; line-height:1;">&times;</button>
    </div>
    <div style="padding:24px;">
      {% block modal_body %}{% endblock %}
    </div>
    {% if show_footer %}
    <div style="padding:16px 24px; border-top:1px solid var(--border-glass); display:flex; justify-content:flex-end; gap:12px;">
      <button data-modal-close class="btn btn-outline">Cancel</button>
      <button id="{{ modal_id }}-confirm" class="btn btn-primary">{{ confirm_text|default:'Confirm' }}</button>
    </div>
    {% endif %}
  </div>
</div>
<style>
  .modal-backdrop.active { display: flex !important; }
</style>
