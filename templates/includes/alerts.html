<!-- alerts.html -->
{% if messages %}
<div class="toast-container" id="toast-container" style="position:fixed; top:80px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px;">
  {% for message in messages %}
  <div class="toast glass" style="padding:16px 20px; display:flex; align-items:center; gap:12px; border-left:4px solid var(--color-{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}primary{% endif %}); animation: slideInRight 0.3s ease, fadeOut 0.4s ease 3.5s forwards;">
    <span style="font-size:18px;">
      {% if message.tags == 'success' %}✅{% elif message.tags == 'error' or message.tags == 'danger' %}❌{% elif message.tags == 'warning' %}⚠️{% else %}ℹ️{% endif %}
    </span>
    <span style="font-size:14px; font-weight:500;">{{ message }}</span>
  </div>
  {% endfor %}
</div>
<script>
document.querySelectorAll('.toast').forEach((el, i) => {
  setTimeout(() => {
    el.style.animation = 'fadeOut 0.4s ease forwards';
    setTimeout(() => el.remove(), 400);
  }, 3500 + i * 300);
});
</script>
{% endif %}
