{% load static %}
<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Changed – {{ company_settings.company_name|default:"Fenix IT Mall" }}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  <script>if(localStorage.getItem('fenix-theme')==='light'){document.documentElement.classList.add('light-theme');}</script>
  <style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: var(--bg-primary); }
  .card {
    width: 100%; max-width: 440px;
    background: var(--bg-card);
    border: 1px solid var(--border-glass);
    border-radius: 20px;
    padding: 48px 40px;
    box-shadow: 0 8px 40px rgba(0,0,0,.2);
    text-align: center;
    margin: 24px;
  }
  html.light-theme .card { background: #fff; box-shadow: 0 8px 40px rgba(0,0,0,.08); }
  .success-icon { font-size: 72px; margin-bottom: 20px; animation: pop .4s ease; }
  @keyframes pop { 0%{transform:scale(0)} 80%{transform:scale(1.1)} 100%{transform:scale(1)} }
  .title { font-size: 26px; font-weight: 800; color: var(--text-primary); margin-bottom: 12px; }
  .desc { font-size: 14px; color: var(--text-muted); line-height: 1.7; margin-bottom: 32px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 32px;
    background: linear-gradient(135deg, #06b6d4, #a855f7);
    border: none; border-radius: 12px;
    color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit; text-decoration: none;
    transition: all .25s ease;
    box-shadow: 0 4px 16px rgba(6,182,212,.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(6,182,212,.45); }
  </style>
</head>
<body>
<div class="card">
  <div class="success-icon">🎉</div>
  <div class="title">Password Changed!</div>
  <div class="desc">
    Your password has been successfully updated.<br>
    You can now log in with your new password.
  </div>
  <a href="{% url 'accounts:login' %}" class="btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
    Go to Login
  </a>
</div>
</body>
</html>
