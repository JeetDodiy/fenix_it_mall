services:
  - type: web
    name: fenix-it-mall
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn fenix_it_mall.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
